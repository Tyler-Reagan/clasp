# GoReleaser configuration for clasp.
# Docs: https://goreleaser.com
version: 2

project_name: clasp

before:
  hooks:
    - go mod tidy

builds:
  - id: clasp
    main: .
    binary: clasp
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}

archives:
  - id: clasp
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

# Publish the generated cask into the personal Homebrew tap.
# Users then run: brew install tyler-reagan/tap/clasp
homebrew_casks:
  - name: clasp
    binaries:
      - clasp
    repository:
      owner: Tyler-Reagan
      name: homebrew-tap
      branch: main
      # PAT with contents:write on homebrew-tap, provided by the release workflow.
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/Tyler-Reagan/clasp"
    description: "A read-only terminal UI companion for Claude Code"
    commit_author:
      name: goreleaser-bot
      email: goreleaser@users.noreply.github.com
    commit_msg_template: "clasp: update cask to {{ .Tag }}"
    # The binary is unsigned, so macOS Gatekeeper quarantines it on download.
    # Strip the quarantine attribute on install so `clasp` launches without
    # the "cannot be opened because the developer cannot be verified" prompt.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/clasp"]
          end

release:
  github:
    owner: Tyler-Reagan
    name: clasp
  draft: false
  prerelease: auto
